<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskRupt preview</title><link rel="stylesheet" href="/app.css"></head><body><div id="root"></div><script>window.addEventListener("error", e => { document.body.insertAdjacentHTML("beforeend", `<pre style="position:fixed;z-index:999;background:#fee;color:#900;padding:12px">${e.message} ${e.filename}:${e.lineno}</pre>`) }); window.addEventListener("unhandledrejection", e => { document.body.insertAdjacentHTML("beforeend", `<pre style="position:fixed;z-index:999;background:#fee;color:#900;padding:12px">${e.reason}</pre>`) });</script><script type="module" src="/app.js"></script></body></html>
